name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean AegisAuthAuditor.spec
      - uses: actions/upload-artifact@v4
        with:
          name: AegisAuthAuditor-Windows
          path: dist/AegisAuthAuditor.exe
